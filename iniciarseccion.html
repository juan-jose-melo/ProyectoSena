<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesion | Inicia Sesion En Tu Cuenta</title>
  <link rel="stylesheet" href="inicia-sesion/iniciarseccion.css">
</head>
<body>

  <div class="auth-card">
    <div class="card-header">
      <h1 id="form-title">Bienvenido</h1>
      <p id="form-subtitle">Ingresa tus credenciales para continuar</p>
    </div>

    <div id="user-welcome" class="welcome-banner hidden">
      <p>Hola de nuevo, <strong id="saved-username">Usuario</strong></p>
      <button id="logout-btn" class="btn-secondary">Cerrar Sesión / Cambiar Cuenta</button>
    </div>

    <form id="auth-form">
      <div class="input-group">
        <label for="username">Usuario o Correo</label>
        <input type="text" id="username" placeholder="ejemplo@correo.com" required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" id="submit-btn" class="btn-primary">Iniciar Sesión</button>
    </form>

    <div class="card-footer">
      <p id="toggle-text">¿No tienes una cuenta? <a href="registro.html" id="toggle-link">Regístrate aquí</a></p>
      
      <a href="index.html" class="btn-home">← Volver al Inicio</a>
    </div>
  </div>

  <script src="inicia-sesion/iniciar-seccion.js"></script>
</body>
</html>
